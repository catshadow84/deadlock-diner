<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Diner | Banker's Algorithm Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e272e;
            color: #dcdde1;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid #ff4757;
        }

        header h1 {
            font-size: 2.8rem;
            color: #ff4757;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8fa6;
            font-size: 1.1rem;
        }

        .card {
            background: #2f3640;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #353b48;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 1.3rem;
            color: #ff4757;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #a4b0be;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            background: #1e272e;
            border: 2px solid #353b48;
            border-radius: 8px;
            color: #f5f6fa;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #ff4757;
        }

        .matrix-section {
            margin-top: 30px;
        }

        .matrix-label {
            color: #a4b0be;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .matrix-table {
            display: inline-block;
            background: #1e272e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #353b48;
        }

        .matrix-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .matrix-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            width: 40px;
            color: #ff4757;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .matrix-cell {
            width: 60px;
        }

        .matrix-cell input {
            width: 100%;
            padding: 10px;
            background: #2f3640;
            border: 1px solid #353b48;
            border-radius: 6px;
            color: #f5f6fa;
            text-align: center;
            font-size: 0.95rem;
        }

        .matrix-cell input:focus {
            outline: none;
            border-color: #ff4757;
        }

        .available-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .available-row .matrix-cell {
            width: 70px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ff4757;
            color: #fff;
        }

        .btn-primary:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        .btn-secondary {
            background: #353b48;
            color: #dcdde1;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #404756;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .status-banner {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            animation: slideDown 0.5s ease;
        }

        .status-safe {
            background: rgba(68, 189, 50, 0.15);
            border: 2px solid #44bd32;
            color: #44bd32;
        }

        .status-deadlock {
            background: rgba(255, 71, 87, 0.15);
            border: 2px solid #ff4757;
            color: #ff4757;
            animation: pulse 2s infinite;
        }

        .safe-sequence {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .sequence-item {
            background: #1e272e;
            border: 2px solid #44bd32;
            color: #44bd32;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sequence-arrow {
            color: #7f8fa6;
            font-size: 1.5rem;
            align-self: center;
        }

        .steps-container {
            margin-top: 20px;
        }

        .step-card {
            background: #1e272e;
            border-left: 4px solid #353b48;
            padding: 18px 22px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.4s forwards;
        }

        .step-card.pass {
            border-left-color: #44bd32;
        }

        .step-card.wait {
            border-left-color: #fbc531;
        }

        .step-card.deadlock {
            border-left-color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .step-process {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .step-process.pass { color: #44bd32; }
        .step-process.wait { color: #fbc531; }
        .step-process.deadlock { color: #ff4757; }

        .step-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-pass { background: rgba(68, 189, 50, 0.2); color: #44bd32; }
        .badge-wait { background: rgba(251, 197, 49, 0.2); color: #fbc531; }
        .badge-deadlock { background: rgba(255, 71, 87, 0.2); color: #ff4757; }

        .step-message {
            color: #a4b0be;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .step-details {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #7f8fa6;
        }

        .detail-item {
            background: #2f3640;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .detail-item span {
            color: #ff4757;
            font-weight: 600;
        }

        .matrices-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .matrix-box {
            background: #1e272e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #353b48;
        }

        .matrix-box h4 {
            color: #ff4757;
            margin-bottom: 12px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .matrix-display-table {
            width: 100%;
            border-collapse: collapse;
        }

        .matrix-display-table th,
        .matrix-display-table td {
            padding: 8px 12px;
            text-align: center;
            border: 1px solid #353b48;
        }

        .matrix-display-table th {
            background: #2f3640;
            color: #ff4757;
            font-size: 0.85rem;
        }

        .matrix-display-table td {
            color: #dcdde1;
            font-family: 'Courier New', monospace;
        }

        .matrix-display-table tr:hover td {
            background: #353b48;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(255, 71, 87, 0.2); }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            color: #ff4757;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #353b48;
            border-top-color: #ff4757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8fa6;
        }

        .empty-state h3 {
            color: #ff4757;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .form-row {
                flex-direction: column;
            }
            .button-group {
                flex-direction: column;
            }
            .btn-secondary {
                margin-left: 0;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Deadlock Diner</h1>
            <p>Banker's Algorithm Visualizer</p>
        </header>

        <div class="card">
            <div class="card-title">⚙️ Configuration</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="exampleSelect">Load Example</label>
                    <select id="exampleSelect">
                        <option value="">-- Custom Input --</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="numProcesses">Number of Processes</label>
                    <input type="number" id="numProcesses" min="1" max="10" value="5">
                </div>
                <div class="form-group">
                    <label for="numResources">Number of Resource Types</label>
                    <input type="number" id="numResources" min="1" max="8" value="3">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="generateMatrices()">Generate Matrices</button>
            </div>
        </div>

        <div class="card" id="inputCard" style="display:none;">
            <div class="card-title">📝 Input Matrices</div>

            <div class="matrix-section">
                <div class="matrix-label">Maximum Demand Matrix (Max)</div>
                <div id="maxMatrix" class="matrix-table"></div>
            </div>

            <div class="matrix-section">
                <div class="matrix-label">Current Allocation Matrix</div>
                <div id="allocMatrix" class="matrix-table"></div>
            </div>

            <div class="matrix-section">
                <div class="matrix-label">Available Resources Vector</div>
                <div id="availVector" class="available-row"></div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="runAnalysis()">🔍 Run Analysis</button>
                <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Running Banker's Algorithm...</p>
        </div>

        <div class="results" id="results">
            <div class="card">
                <div class="card-title">📊 System Matrices</div>
                <div class="matrices-display" id="matricesDisplay"></div>
            </div>

            <div class="card">
                <div class="card-title">🎯 Analysis Result</div>
                <div id="statusBanner"></div>
                <div id="safeSequence"></div>
            </div>

            <div class="card">
                <div class="card-title">🎬 Execution Steps</div>
                <div class="steps-container" id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let examples = {};

        async function loadExamples() {
            try {
                const res = await fetch('/api/examples');
                const data = await res.json();
                const select = document.getElementById('exampleSelect');
                data.examples.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.textContent = ex.name;
                    select.appendChild(opt);
                    examples[ex.id] = ex;
                });
            } catch (e) {
                console.error('Failed to load examples:', e);
            }
        }

        document.getElementById('exampleSelect').addEventListener('change', async function() {
            const id = this.value;
            if (!id) return;
            try {
                const res = await fetch(`/api/example/${id}`);
                const data = await res.json();
                document.getElementById('numProcesses').value = data.allocation.length;
                document.getElementById('numResources').value = data.available.length;
                generateMatrices();
                setTimeout(() => fillMatrices(data), 100);
            } catch (e) {
                alert('Failed to load example');
            }
        });

        function generateMatrices() {
    const n = parseInt(document.getElementById('numProcesses').value) || 0;
    const m = parseInt(document.getElementById('numResources').value) || 0;

    if (n < 1 || m < 1 || n > 10 || m > 8) {
        alert('Please enter valid numbers (1-10 processes, 1-8 resources)');
        return;
    }

    const oldMax = {};
    const oldAlloc = {};
    const oldAvail = {};
    
    document.querySelectorAll('input[data-matrix="max"]').forEach(inp => {
        oldMax[`${inp.dataset.row},${inp.dataset.col}`] = inp.value;
    });
    document.querySelectorAll('input[data-matrix="alloc"]').forEach(inp => {
        oldAlloc[`${inp.dataset.row},${inp.dataset.col}`] = inp.value;
    });
    document.querySelectorAll('input[data-matrix="avail"]').forEach(inp => {
        oldAvail[inp.dataset.col] = inp.value;
    });

    document.getElementById('inputCard').style.display = 'block';

    const maxContainer = document.getElementById('maxMatrix');
    maxContainer.innerHTML = '';
    for (let i = 0; i < n; i++) {
        const row = document.createElement('div');
        row.className = 'matrix-row';
        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = `P${i}`;
        row.appendChild(label);
        for (let j = 0; j < m; j++) {
            const cell = document.createElement('div');
            cell.className = 'matrix-cell';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.value = oldMax[`${i},${j}`] || '0';
            input.dataset.matrix = 'max';
            input.dataset.row = i;
            input.dataset.col = j;
            cell.appendChild(input);
            row.appendChild(cell);
        }
        maxContainer.appendChild(row);
    }

    const allocContainer = document.getElementById('allocMatrix');
    allocContainer.innerHTML = '';
    for (let i = 0; i < n; i++) {
        const row = document.createElement('div');
        row.className = 'matrix-row';
        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = `P${i}`;
        row.appendChild(label);
        for (let j = 0; j < m; j++) {
            const cell = document.createElement('div');
            cell.className = 'matrix-cell';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.value = oldAlloc[`${i},${j}`] || '0';
            input.dataset.matrix = 'alloc';
            input.dataset.row = i;
            input.dataset.col = j;
            cell.appendChild(input);
            row.appendChild(cell);
        }
        allocContainer.appendChild(row);
    }

    const availContainer = document.getElementById('availVector');
    availContainer.innerHTML = '';
    for (let j = 0; j < m; j++) {
        const cell = document.createElement('div');
        cell.className = 'matrix-cell';
        const input = document.createElement('input');
        input.type = 'number';
        input.min = '0';
        input.value = oldAvail[j] || '0';
        input.dataset.matrix = 'avail';
        input.dataset.col = j;
        cell.appendChild(input);
        availContainer.appendChild(cell);
    }
}

        function fillMatrices(data) {
            data.max_demand.forEach((row, i) => {
                row.forEach((val, j) => {
                    const input = document.querySelector(`input[data-matrix="max"][data-row="${i}"][data-col="${j}"]`);
                    if (input) input.value = val;
                });
            });
            data.allocation.forEach((row, i) => {
                row.forEach((val, j) => {
                    const input = document.querySelector(`input[data-matrix="alloc"][data-row="${i}"][data-col="${j}"]`);
                    if (input) input.value = val;
                });
            });
            data.available.forEach((val, j) => {
                const input = document.querySelector(`input[data-matrix="avail"][data-col="${j}"]`);
                if (input) input.value = val;
            });
        }

        function getMatrixValues(matrixName) {
            const n = parseInt(document.getElementById('numProcesses').value);
            const m = parseInt(document.getElementById('numResources').value);
            const matrix = [];
            for (let i = 0; i < n; i++) {
                const row = [];
                for (let j = 0; j < m; j++) {
                    const input = document.querySelector(`input[data-matrix="${matrixName}"][data-row="${i}"][data-col="${j}"]`);
                    row.push(parseInt(input?.value || 0));
                }
                matrix.push(row);
            }
            return matrix;
        }

        function getAvailableValues() {
            const m = parseInt(document.getElementById('numResources').value);
            const vals = [];
            for (let j = 0; j < m; j++) {
                const input = document.querySelector(`input[data-matrix="avail"][data-col="${j}"]`);
                vals.push(parseInt(input?.value || 0));
            }
            return vals;
        }

        async function runAnalysis() {
            const available = getAvailableValues();
            const maxDemand = getMatrixValues('max');
            const allocation = getMatrixValues('alloc');

            for (let i = 0; i < maxDemand.length; i++) {
                for (let j = 0; j < maxDemand[i].length; j++) {
                    if (allocation[i][j] > maxDemand[i][j]) {
                        alert(`Invalid: Allocation[${i}][${j}] > Max[${i}][${j}]`);
                        return;
                    }
                }
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ available, max_demand: maxDemand, allocation })
                });
                const data = await res.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                displayResults(data);
            } catch (e) {
                alert('Failed to run analysis: ' + e.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        function displayResults(data) {
            const results = document.getElementById('results');
            results.classList.add('active');

            const matricesDiv = document.getElementById('matricesDisplay');
            matricesDiv.innerHTML = '';

            const matrices = [
                { name: 'Maximum Demand', data: data.max_matrix },
                { name: 'Allocation', data: data.allocation_matrix },
                { name: 'Need (Max - Alloc)', data: data.need_matrix }
            ];

            matrices.forEach(mat => {
                const box = document.createElement('div');
                box.className = 'matrix-box';
                const title = document.createElement('h4');
                title.textContent = mat.name;
                box.appendChild(title);

                const table = document.createElement('table');
                table.className = 'matrix-display-table';
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                const thEmpty = document.createElement('th');
                thEmpty.textContent = '';
                headerRow.appendChild(thEmpty);
                for (let j = 0; j < mat.data[0].length; j++) {
                    const th = document.createElement('th');
                    th.textContent = `R${j}`;
                    headerRow.appendChild(th);
                }
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                mat.data.forEach((row, i) => {
                    const tr = document.createElement('tr');
                    const tdLabel = document.createElement('td');
                    tdLabel.innerHTML = `<strong style="color:#ff4757">P${i}</strong>`;
                    tr.appendChild(tdLabel);
                    row.forEach(val => {
                        const td = document.createElement('td');
                        td.textContent = val;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                box.appendChild(table);
                matricesDiv.appendChild(box);
            });

            const availBox = document.createElement('div');
            availBox.className = 'matrix-box';
            availBox.innerHTML = `<h4>Available</h4>`;
            const availTable = document.createElement('table');
            availTable.className = 'matrix-display-table';
            const availHead = document.createElement('thead');
            const availHeadRow = document.createElement('tr');
            data.available.forEach((_, j) => {
                const th = document.createElement('th');
                th.textContent = `R${j}`;
                availHeadRow.appendChild(th);
            });
            availHead.appendChild(availHeadRow);
            availTable.appendChild(availHead);
            const availBody = document.createElement('tbody');
            const availBodyRow = document.createElement('tr');
            data.available.forEach(val => {
                const td = document.createElement('td');
                td.textContent = val;
                availBodyRow.appendChild(td);
            });
            availBody.appendChild(availBodyRow);
            availTable.appendChild(availBody);
            availBox.appendChild(availTable);
            matricesDiv.appendChild(availBox);

            const banner = document.getElementById('statusBanner');
            if (data.safe) {
                banner.className = 'status-banner status-safe';
                banner.innerHTML = '✅ SAFE STATE DETECTED — System can allocate resources without deadlock';
            } else {
                banner.className = 'status-banner status-deadlock';
                banner.innerHTML = '🚨 DEADLOCK DETECTED — Circular wait condition found!';
            }

            const seqDiv = document.getElementById('safeSequence');
            seqDiv.innerHTML = '';
            if (data.safe && data.sequence.length > 0) {
                const container = document.createElement('div');
                container.className = 'safe-sequence';
                data.sequence.forEach((proc, idx) => {
                    const item = document.createElement('div');
                    item.className = 'sequence-item';
                    item.textContent = proc;
                    container.appendChild(item);
                    if (idx < data.sequence.length - 1) {
                        const arrow = document.createElement('div');
                        arrow.className = 'sequence-arrow';
                        arrow.textContent = '→';
                        container.appendChild(arrow);
                    }
                });
                seqDiv.appendChild(container);
            } else if (!data.safe) {
                const dead = document.createElement('div');
                dead.className = 'safe-sequence';
                dead.innerHTML = `<div style="color:#ff4757; font-size:1.1rem;">Deadlocked Processes: <strong>${data.deadlock_processes.join(', ')}</strong></div>`;
                seqDiv.appendChild(dead);
            }

            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = '';

            data.steps.forEach((step, idx) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = `step-card ${step.result.toLowerCase()}`;

                    const header = document.createElement('div');
                    header.className = 'step-header';

                    const proc = document.createElement('div');
                    proc.className = `step-process ${step.result.toLowerCase()}`;
                    proc.textContent = step.process === 'SYSTEM' ? '🔧 System Check' : `Process ${step.process}`;

                    const badge = document.createElement('span');
                    badge.className = `step-badge badge-${step.result.toLowerCase()}`;
                    badge.textContent = step.result;

                    header.appendChild(proc);
                    header.appendChild(badge);
                    card.appendChild(header);

                    const msg = document.createElement('div');
                    msg.className = 'step-message';
                    msg.textContent = step.message;
                    card.appendChild(msg);

                    if (step.process !== 'SYSTEM') {
                        const details = document.createElement('div');
                        details.className = 'step-details';
                        details.innerHTML = `
                            <div class="detail-item">Work: <span>[${step.work.join(', ')}]</span></div>
                            <div class="detail-item">Need: <span>[${step.need.join(', ')}]</span></div>
                            <div class="detail-item">Alloc: <span>[${step.allocation.join(', ')}]</span></div>
                        `;
                        card.appendChild(details);
                    }

                    stepsContainer.appendChild(card);
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, idx * 600);
            });
        }

        function clearAll() {
            document.getElementById('numProcesses').value = 5;
            document.getElementById('numResources').value = 3;
            document.getElementById('exampleSelect').value = ''; 
            document.getElementById('inputCard').style.display = 'none';
            document.getElementById('results').classList.remove('active');
        }

        loadExamples();
        generateMatrices();
    </script>
</body>
</html>
